# Decap CMS config. Beth logs in at /admin and edits content; every save is a git commit that redeploys the site.
# TODO(JT): wire auth before handing over. Options, all free:
#   - backend github + a small OAuth proxy (Cloudflare Worker) — Beth logs in with a GitHub account added as a collaborator
#   - Sveltia CMS (same config) with its one-click Cloudflare Worker OAuth
#   - Pages CMS (pagescms.org) instead of Decap: no OAuth proxy needed, GitHub login only
backend:
  name: github
  repo: REPLACE-ME/beth-hacker-afc
  branch: main
  # base_url: https://REPLACE-ME.workers.dev   # OAuth proxy, once deployed

media_folder: public/images
public_folder: /images

collections:
  - name: resources
    label: Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: url, label: Link (leave blank for members-only items), widget: string, required: false }
      - { name: audience, label: Audience, widget: string, default: Everyone, hint: "e.g. Everyone, Military, Divorce, Credit & debt" }
      - { name: access, label: Who can see it, widget: select, options: [{ label: "Free (anyone)", value: public }, { label: "Cohort members only", value: members }, { label: "Sold as a workbook / product", value: purchase }], default: public }
      - { name: order, label: Sort order (lower = higher on the page), widget: number, default: 50 }
      - { name: published, label: Published, widget: boolean, default: true }
      - { name: body, label: Why I send people here, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Contact, prices, and links
        file: src/data/site.json
        fields:
          - { name: businessName, label: Business name, widget: string }
          - { name: ownerName, label: Your name and credentials, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: phone, label: Phone (as shown), widget: string }
          - { name: phoneHref, label: Phone link, widget: string, hint: "tel:+1..." }
          - { name: email, label: Public email, widget: string, required: false }
          - { name: location, label: Location line, widget: string }
          - { name: hours, label: Hours line, widget: string }
          - { name: bookingUrl, label: Booking link (Cal.com), widget: string }
          - { name: waitlistUrl, label: Cohort waitlist form, widget: string }
          - { name: contactFormUrl, label: Contact form, widget: string }
          - { name: linkedin, label: LinkedIn, widget: string }
          - { name: afcpeCompetencies, label: AFCPE competencies link, widget: string }
          - { name: afcpeEthics, label: AFCPE ethics link, widget: string }
          - name: stripe
            label: Stripe payment links
            widget: object
            fields:
              - { name: singleSession, label: Single session, widget: string }
              - { name: sixWeekPackage, label: Six-week package, widget: string }
              - { name: cohortMonthly, label: Cohort month-to-month, widget: string }
              - { name: cohortSixMonth, label: Cohort six-month, widget: string }
              - { name: divorcePackage, label: Divorce package, widget: string }
          - name: prices
            label: Prices (as shown)
            widget: object
            fields:
              - { name: singleSession, label: Single session, widget: string }
              - { name: consult, label: Consult, widget: string }
              - { name: sixWeekPackage, label: Six-week package, widget: string }
              - { name: cohortMonthly, label: Cohort month-to-month, widget: string }
              - { name: cohortSixMonth, label: Cohort six-month, widget: string }
              - { name: divorcePackage, label: Divorce package, widget: string }
              - { name: nonprofitCohort, label: Nonprofit cohort, widget: string }
              - { name: nonprofitHourly, label: Nonprofit hourly, widget: string }
